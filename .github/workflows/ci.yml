name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON manifests
        run: |
          python3 -m json.tool .claude-plugin/plugin.json > /dev/null
          python3 -m json.tool .claude-plugin/marketplace.json > /dev/null
          python3 -m json.tool hooks/hooks.json > /dev/null
      - name: Guard hook behavioral tests
        run: |
          set -e
          mkdir -p /tmp/p/.workflow && cd /tmp/p && git init -q .
          # spawn guard: long prompt + no ledger -> deny
          rm -rf /tmp/p/.workflow && mkdir -p /tmp/p
          echo "{\"tool_name\":\"Task\",\"session_id\":\"ci\",\"cwd\":\"/tmp/p\",\"tool_input\":{\"prompt\":\"$(printf 'x%.0s' $(seq 1 2000))\"}}" \
            | python3 $GITHUB_WORKSPACE/scripts/ledger_guard_spawn.py | grep -q '"deny"'
          # spawn guard: ledger present -> silent
          mkdir -p /tmp/p/.workflow && printf -- '- [ ] 1. item\n' > /tmp/p/.workflow/LEDGER.md
          out=$(echo "{\"tool_name\":\"Task\",\"session_id\":\"ci\",\"cwd\":\"/tmp/p\",\"tool_input\":{\"prompt\":\"$(printf 'x%.0s' $(seq 1 2000))\"}}" \
            | python3 $GITHUB_WORKSPACE/scripts/ledger_guard_spawn.py)
          test -z "$out"
          # stop guard: open item -> block, second stop -> silent
          echo '{"session_id":"ci-stop","cwd":"/tmp/p","stop_hook_active":false}' \
            | python3 $GITHUB_WORKSPACE/scripts/ledger_guard_stop.py | grep -q '"block"'
          out=$(echo '{"session_id":"ci-stop","cwd":"/tmp/p","stop_hook_active":false}' \
            | python3 $GITHUB_WORKSPACE/scripts/ledger_guard_stop.py)
          test -z "$out"
          # stop guard: another session's ledger (this session never wrote it) -> silent
          printf '%s\n' '{"type":"user","message":{"content":"just looking around"}}' > /tmp/t-visitor.jsonl
          out=$(echo '{"session_id":"ci-h2","cwd":"/tmp/p","stop_hook_active":false,"transcript_path":"/tmp/t-visitor.jsonl"}' \
            | python3 $GITHUB_WORKSPACE/scripts/ledger_guard_stop.py)
          test -z "$out"
          # stop guard: our ledger, but a spawned agent has not reported back -> silent
          printf '%s\n' '{"type":"assistant","message":{"content":[{"type":"tool_use","name":"Edit","id":"e1","input":{"file_path":"/tmp/p/.workflow/LEDGER.md"}}]}}' > /tmp/t-waiting.jsonl
          printf '%s\n' '{"type":"user","message":{"content":[{"type":"tool_result","tool_use_id":"toolu_a","content":"Async agent launched successfully."}]}}' >> /tmp/t-waiting.jsonl
          out=$(echo '{"session_id":"ci-h1","cwd":"/tmp/p","stop_hook_active":false,"transcript_path":"/tmp/t-waiting.jsonl"}' \
            | python3 $GITHUB_WORKSPACE/scripts/ledger_guard_stop.py)
          test -z "$out"
          # stop guard: our ledger and the agent reported back -> block
          cp /tmp/t-waiting.jsonl /tmp/t-closing.jsonl
          printf '%s\n' '{"type":"user","message":{"content":"<task-notification><tool-use-id>toolu_a</tool-use-id><status>completed</status></task-notification>"}}' >> /tmp/t-closing.jsonl
          echo '{"session_id":"ci-h3","cwd":"/tmp/p","stop_hook_active":false,"transcript_path":"/tmp/t-closing.jsonl"}' \
            | python3 $GITHUB_WORKSPACE/scripts/ledger_guard_stop.py | grep -q '"block"'
          # inline counter: fires at 10
          for i in $(seq 1 10); do
            last=$(echo '{"tool_name":"Read","session_id":"ci-cnt"}' | bash $GITHUB_WORKSPACE/hooks/inline-counter.sh)
          done
          echo "$last" | grep -q '10 consecutive'
          # inline counter: silent inside a subagent (payload carries agent_id)
          out=$(echo '{"tool_name":"Read","session_id":"ci-cnt","agent_id":"a1","agent_type":"fable-relay:scout"}' \
            | bash $GITHUB_WORKSPACE/hooks/inline-counter.sh)
          test -z "$out"
          echo "all guard tests passed"
      - name: SessionStart injection renders
        run: |
          export CLAUDE_PLUGIN_ROOT=$GITHUB_WORKSPACE
          echo '{"session_id":"ci-ss","model":"claude-fable-5"}' | bash hooks/session-start.sh | grep -q "Orchestration policy"
          echo '{"session_id":"ci-ss2","model":"claude-opus-4-8"}' | bash hooks/session-start.sh | grep -q "adaptation: Opus"
